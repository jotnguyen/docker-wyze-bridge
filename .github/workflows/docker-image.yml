name: Docker

# Fork build: GHCR only (no Docker Hub secrets here), multiarch image only,
# amd64 + arm64 (the OCI VM is aarch64). Tags vX.Y.Z[-suffix] publish a release image.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=main

      - name: Set VERSION from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^VERSION=.*/VERSION=${GITHUB_REF##*/v}/" ./app/.env

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ github.event_name != 'pull_request' }}
          context: .
          file: ./docker/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD=${{ steps.meta.outputs.version }}
            GITHUB_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
