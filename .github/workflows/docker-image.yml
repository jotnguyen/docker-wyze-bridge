name: Docker

# Fork build: same image variants as upstream, published to GHCR only (no Docker Hub).
# Tags vX.Y.Z[-suffix] publish a release image; hwaccel/qsv get a -hw/-qsv tag suffix.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        dockerfile: ['multiarch', 'hwaccel', 'qsv']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Matrix image type
        id: image_type
        run: |
          echo "suffix=${{ matrix.dockerfile == 'hwaccel' && '-hw' || matrix.dockerfile == 'qsv' && '-qsv' || '' }}" >> $GITHUB_OUTPUT
          echo "platforms=${{ matrix.dockerfile == 'multiarch' && 'linux/amd64,linux/arm64,linux/arm/v7' || 'linux/amd64' }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ steps.image_type.outputs.platforms }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=${{ steps.image_type.outputs.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=main

      - name: Set VERSION from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^VERSION=.*/VERSION=${GITHUB_REF##*/v}/" ./app/.env

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ github.event_name != 'pull_request' }}
          context: .
          file: ./docker/Dockerfile.${{ matrix.dockerfile }}
          platforms: ${{ steps.image_type.outputs.platforms }}
          build-args: |
            BUILD=${{ steps.meta.outputs.version }}
            GITHUB_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
          provenance: false
